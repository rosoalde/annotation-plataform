
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       annotation_db
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./
    command: uvicorn main:app --host 0.0.0.0 --port 8007 --reload
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/annotation_db
      SECRET_KEY: change-me-in-production-use-32chars!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app                # <-- monta TODO el proyecto
    working_dir: /app

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8007/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: